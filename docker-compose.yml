services:
  web:
    build: .
    command: node app.js
    restart: always
    ports:
      - "8080:3000"
    environment:
      - DB_HOST=db
      - DB_USER=ryuu
      - DB_PASSWORD=rahasia123
      - DB_NAME=db_latihan
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ryuu
      POSTGRES_PASSWORD: rahasia123
      POSTGRES_DB: db_latihan
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
